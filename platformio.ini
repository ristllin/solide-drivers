; ============================================================================
; solide-drivers — board-support package for the Solide S3 device
; (ESP32-S3-DevKitC-1 N16R8). This platformio.ini builds the package's own
; examples + host tests; consuming firmware imports the package via lib_deps
; and supplies its own platform/board (see docs/getting-started.md).
;
;   Host unit tests:   pio test -e native
;   M0 platform smoke: pio run -e smoke -t upload -t monitor
; ============================================================================
[platformio]
src_dir = .
include_dir = include

; ---- Host unit tests for the portable core (no hardware, no Arduino) --------
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags = -std=gnu++17 -Iinclude
build_src_filter = -<*> +<src/portable/>

; ---- M0 platform de-risk: pioarduino (Arduino-ESP32 3.x / ESP-IDF 5.x) -------
; Builds ONLY the smoke example (no drivers) to prove the toolchain. Pin the
; exact working release once M0 passes; record it in docs/modernization.md.
[env:smoke]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DSOLIDE_BOARD=solide_s3
build_src_filter = -<*> +<examples/01_smoke_blink_serial/>

; ---- Full device build: the package drivers + one example ---------------------
; Pick the example with the SOLIDE_EXAMPLE env var, e.g.
;   SOLIDE_EXAMPLE=03_led_ring pio run -e esp32s3 -t upload
[env:esp32s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1
    -DSOLIDE_BOARD=solide_s3
lib_deps =
    adafruit/Adafruit NeoPixel
    zinggjm/GxEPD2
    bblanchon/ArduinoJson
build_src_filter = -<*> +<src/portable/> +<src/device/> +<examples/${sysenv.SOLIDE_EXAMPLE}/>
