<svg viewBox="0 0 980 720" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,sans-serif">
  <style>
    .mod  { fill:#f6f6f3; stroke:#333; stroke-width:1.5; rx:8; }
    .mcu  { fill:#26344f; stroke:#12203a; stroke-width:2; }
    .t    { fill:#222; font-size:13px; }
    .tb   { fill:#222; font-size:14px; font-weight:700; }
    .tw   { fill:#fff; font-size:15px; font-weight:700; }
    .pin  { fill:#444; font-size:11px; font-family:ui-monospace,Menlo,monospace; }
    .pinw { fill:#cdd8ea; font-size:11px; font-family:ui-monospace,Menlo,monospace; }
    .lbl  { font-size:11px; font-weight:600; }
    .warn { fill:#b12; font-size:11px; font-weight:700; }
  </style>

  <text x="490" y="30" text-anchor="middle" class="tb" font-size="19">Solide S3 — wiring overview</text>
  <text x="490" y="50" text-anchor="middle" class="t" fill="#666">pins from board_solide_s3.h · full connection tables in build.md</text>

  <!-- MCU -->
  <rect class="mcu" x="390" y="300" width="200" height="150" rx="10"/>
  <text x="490" y="360" text-anchor="middle" class="tw">ESP32-S3</text>
  <text x="490" y="382" text-anchor="middle" class="pinw">DevKitC-1 N16R8</text>
  <text x="490" y="404" text-anchor="middle" class="pinw">16MB / 8MB PSRAM</text>
  <text x="490" y="430" text-anchor="middle" class="pinw" fill="#8fa6c8">USB-CDC · 3V3 LDO</text>

  <!-- E-paper (top-left) -->
  <rect class="mod" x="40" y="90" width="230" height="86" rx="8"/>
  <text x="52" y="112" class="tb">E-paper 2.9" 3-colour</text>
  <text x="52" y="132" class="pin">SCK38 MOSI39 CS40 DC41</text>
  <text x="52" y="148" class="pin">RST42 BUSY47  ·  VCC 3V3</text>
  <text x="52" y="167" class="t" fill="#666">HSPI · SDA=MOSI SCL=SCK</text>
  <line x1="270" y1="150" x2="392" y2="320" stroke="#3b6ea5" stroke-width="2"/>
  <text x="300" y="228" class="lbl" fill="#3b6ea5">SPI (HSPI)</text>

  <!-- SD (left) -->
  <rect class="mod" x="40" y="300" width="210" height="70" rx="8"/>
  <text x="52" y="322" class="tb">microSD (FAT32)</text>
  <text x="52" y="342" class="pin">CS10 MOSI11 SCK12 MISO13</text>
  <text x="52" y="360" class="t" fill="#666">FSPI · VCC 3V3</text>
  <line x1="250" y1="340" x2="390" y2="360" stroke="#3b6ea5" stroke-width="2"/>
  <text x="290" y="340" class="lbl" fill="#3b6ea5">SPI (FSPI)</text>

  <!-- Encoder (bottom-left) -->
  <rect class="mod" x="40" y="470" width="210" height="72" rx="8"/>
  <text x="52" y="492" class="tb">EC11 encoder</text>
  <text x="52" y="512" class="pin">A1  B2  SW48  ·  common GND</text>
  <text x="52" y="530" class="t" fill="#666">internal pull-ups</text>
  <line x1="250" y1="500" x2="392" y2="420" stroke="#3b6ea5" stroke-width="2"/>
  <text x="290" y="470" class="lbl" fill="#3b6ea5">GPIO</text>

  <!-- LED ring (top-right) -->
  <rect class="mod" x="710" y="90" width="230" height="80" rx="8"/>
  <text x="722" y="112" class="tb">WS2812B ring ×45</text>
  <text x="722" y="132" class="pin">DIN 21  ·  +5V  ·  GND</text>
  <text x="722" y="150" class="warn">needs 5V bus to light</text>
  <line x1="710" y1="140" x2="588" y2="315" stroke="#3b6ea5" stroke-width="2"/>
  <text x="640" y="228" class="lbl" fill="#3b6ea5">DIN 21</text>
  <line x1="710" y1="128" x2="640" y2="600" stroke="#e08a2b" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Audio (right) -->
  <rect class="mod" x="710" y="300" width="230" height="120" rx="8"/>
  <text x="722" y="322" class="tb">Audio board</text>
  <text x="722" y="342" class="pin">spk BCLK7 LRCLK8 DIN17</text>
  <text x="722" y="360" class="pin">mic CLK15 DATA16</text>
  <text x="722" y="380" class="warn">VCC 3.3V ONLY — 5V kills the S3</text>
  <text x="722" y="404" class="t" fill="#666">I2S TX + PDM RX</text>
  <line x1="710" y1="360" x2="590" y2="375" stroke="#3b6ea5" stroke-width="2"/>
  <text x="628" y="352" class="lbl" fill="#3b6ea5">I2S/PDM</text>

  <!-- Battery sense (bottom center) -->
  <rect class="mod" x="360" y="560" width="260" height="110" rx="8" stroke-dasharray="5 3"/>
  <text x="372" y="582" class="tb">Battery sense (add-on)</text>
  <text x="372" y="602" class="pin">BAT+ ─[220k]─┬─[100k]─ GND</text>
  <text x="372" y="620" class="pin">            └─▶ GPIO 4 (ADC1)</text>
  <text x="372" y="640" class="t" fill="#666">÷3.2 · 8.4V→2.6V · +100nF</text>
  <text x="372" y="659" class="t" fill="#666">sense the PACK, not the 5V rail</text>
  <line x1="490" y1="560" x2="490" y2="452" stroke="#3b6ea5" stroke-width="2"/>
  <text x="498" y="510" class="lbl" fill="#3b6ea5">ADC 4</text>

  <!-- Power chain (bottom) -->
  <rect x="640" y="560" width="300" height="120" rx="8" fill="#fdf6ec" stroke="#e08a2b" stroke-width="1.5"/>
  <text x="652" y="582" class="tb" fill="#a2611a">Power</text>
  <text x="652" y="604" class="pin">USB-C ▶ 2S BMS ▶ 2×18650</text>
  <text x="652" y="622" class="pin">      ▶ DC-DC ▶ 5V bus</text>
  <text x="652" y="646" class="t" fill="#a2611a">5V ▶ LED ring + ESP32 VIN</text>
  <text x="652" y="663" class="t" fill="#c33">3V3 ▶ e-paper·SD·audio·encoder</text>

  <!-- Legend -->
  <line x1="40" y1="600" x2="70" y2="600" stroke="#3b6ea5" stroke-width="2"/>
  <text x="76" y="604" class="pin">data / signal</text>
  <line x1="40" y1="620" x2="70" y2="620" stroke="#e08a2b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="76" y="624" class="pin">5V bus</text>
  <text x="40" y="644" class="pin">3V3 rail powers all except the LED ring</text>
  <text x="40" y="662" class="pin">all grounds common</text>
</svg>
